<!DOCTYPE html>
<html>
<head>
  <title>Lessons</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <a href="index.html">Dashboard</a>
  <a href="lessons.html">Lessons</a>
  <a href="quiz.html">Tests</a>
  <a href="#" onclick="loadLesson('genMath')">Gen Math</a>
</nav>

<div class="container">

  <!-- This will get replaced by the lesson title -->
  <h2 id="lessonTitle">Select a Lesson</h2>

  <!-- Buttons to switch between full lesson and summary -->
  <button onclick="showLesson()">Lesson</button>
  <button onclick="showSummary()">Summary</button>

  <!-- Content will be inserted here by JS -->
  <div class="card" id="content"></div>

  <!-- Link to video -->
  <br>
  <a id="video" target="_blank">📺 Watch Related Videos</a>

</div>

<script src="js/data.js"></script>
<script>
  let current;

  function loadLesson(id) {
    current = lessons[id];
    document.getElementById("lessonTitle").innerText = current.title;
    showLesson();
    document.getElementById("video").href = current.video;
  }

  function showLesson() {
    document.getElementById("content").innerText = current.lesson;
  }

  function showSummary() {
    document.getElementById("content").innerText = current.summary;
  }
</script>

</body>
</html>
